# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME

# Universal copy/paste: honor Ctrl+Insert / Shift+Insert (sent by Hyprland's Super+C/V)
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

# Remote control — the write-path behind the Deck (`bsctl agents send`). kitty
# exports the socket (KITTY_LISTEN_ON) and its window id (KITTY_WINDOW_ID)
# into every child, so each agent's hooks record the exact route to their
# own window — correct whether one kitty process serves many windows (macOS)
# or each window is its own process (the pid-named socket, which bsctl also
# falls back to). socket-only keeps it off the keyboard/allow-all surface.
# Windows launched BEFORE this line carry no socket — relaunch to gain one.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# Per-OS settings: kitty sets KITTY_OS (linux, macos, ...), so each platform
# loads only its own file from this package.
include ${KITTY_OS}.conf
