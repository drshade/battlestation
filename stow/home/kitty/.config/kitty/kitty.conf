# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME

# Universal copy/paste: honor Ctrl+Insert / Shift+Insert (sent by Hyprland's Super+C/V)
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

# Remote control — the write-path behind the Deck (`bsctl agents send`). Each
# kitty window is its own process here, so each listens on a socket named by
# its own pid; that pid is exactly the term_pid bsctl already captures per
# session, so term_pid IS the routing key (no window scan). socket-only keeps
# it off the keyboard/allow-all surface. Windows launched BEFORE this line
# carry no socket — relaunch to gain one.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}
