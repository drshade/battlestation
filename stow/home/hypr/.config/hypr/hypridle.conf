# hypridle — drives the sleep/lock path so hyprlock (not Noctalia) is the
# session locker. This replaces Noctalia's `lockOnSuspend`, which coupled the
# locker to the shell. See setup/deps-00-hyprlock-hypridle.md for the why.
#
# The hooks in `general` react to logind's Lock / PrepareForSleep D-Bus
# signals, not timers. There is still NO idle-lock and no screen-off during
# normal (unlocked) use — Noctalia's idle stays off. Of the two `listener`
# blocks below, the first only REPORTS idleness to bsctl; the second blanks the
# panels once the session is already LOCKED (gated on hyprlock), never before.

general {
    # Guard against a second instance if a Lock signal arrives while locked.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before the machine sleeps: emits the session Lock signal, which this
    # same daemon catches and answers with lock_cmd, so the surface is up before
    # suspend (no unlocked flash on resume).
    before_sleep_cmd = loginctl lock-session

    # Force displays back on after resume — directly counters the black screen.
    # NOT `hyprctl dispatch 'hl.dsp.dpms("on")'`: the string form ignores its arg
    # and *toggles* all monitors, so a mixed DPMS state comes back half-off. The
    # script sets each output on explicitly (table form). See AGENTS.md gotchas.
    after_sleep_cmd = $HOME/.config/hypr/scripts/displays-on.sh
}

# Presence: after 2 quiet minutes report idle, on input report active. bsctl
# records it for the agent desk (`bsctl presence`; contract in ctl/src/lib.rs
# — the world's `human` section and the MCP ask-timeout note read it, so a
# waiting agent knows how long the human has been away). Recovery boundary:
# a missing/broken bsctl just fails these commands harmlessly — the lock and
# sleep duties above never depend on it.
listener {
    timeout = 120
    # --already mirrors the timeout above: on-timeout fires AFTER 120 quiet
    # seconds, so the human has already been idle that long — backdate it.
    on-timeout = $HOME/.local/bin/bsctl presence set idle --already 120
    on-resume = $HOME/.local/bin/bsctl presence set active
}

# Blank the panels 10s after the session LOCKS -- but NOT during normal use.
# This listener is armed always, but both commands are gated on `pidof hyprlock`
# so they are a complete no-op while unlocked; only once hyprlock owns the
# screen does the timeout blank the outputs, and any input wakes them back to
# the lock clock.
#
# ignore_inhibit = true is REQUIRED: hyprlock holds an idle inhibitor while it
# is the active locker, so with the default (respect inhibitors) this timeout
# never fires -- the exact case we want it to. Ignoring the inhibitor is safe
# because the ACTION is still gated on `pidof hyprlock`: the timeout may fire
# during an unlocked video too, but displays-off.sh only runs when locked.
#
# DPMS is toggle-only on this build (see AGENTS.md gotchas), so neither
# direction is `hyprctl dispatch dpms off/on` -- both go through the scripts
# that read dpmsStatus and toggle only the outputs on the wrong side.
listener {
    timeout = 10
    ignore_inhibit = true
    on-timeout = pidof hyprlock && $HOME/.config/hypr/scripts/displays-off.sh
    on-resume = pidof hyprlock && $HOME/.config/hypr/scripts/displays-on.sh
}
