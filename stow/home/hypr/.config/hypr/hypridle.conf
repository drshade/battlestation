# hypridle — drives the sleep/lock path so hyprlock (not Noctalia) is the
# session locker. This replaces Noctalia's `lockOnSuspend`, which coupled the
# locker to the shell. See setup/deps-00-hyprlock-hypridle.md for the why.
#
# Only the signal-driven hooks are set — there are NO `listener` (timeout)
# blocks, so idle behaviour is unchanged (Noctalia's idle was already off). The
# hooks below react to logind's Lock / PrepareForSleep D-Bus signals, not timers.

general {
    # Guard against a second instance if a Lock signal arrives while locked.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before the machine sleeps: emits the session Lock signal, which this
    # same daemon catches and answers with lock_cmd, so the surface is up before
    # suspend (no unlocked flash on resume).
    before_sleep_cmd = loginctl lock-session

    # Force displays back on after resume — directly counters the black screen.
    # Legacy `dispatch dpms on` is rejected by the Lua parser; use the hl.* form
    # (see AGENTS.md gotchas).
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}
