# hyprlock — the ext-session-lock client for the suspend/idle path.
#
# Deliberately minimal and, crucially, a SEPARATE process from the Noctalia
# shell. Noctalia used to draw the lock surface itself, so a shell crash on
# resume left the compositor holding an ext-session-lock with nothing rendering
# the password prompt — a black screen that looked like a failed resume. A
# dedicated locker can't share that fate. See setup/deps-00-hyprlock-hypridle.md.

general {
    hide_cursor = true
    ignore_empty_input = true   # don't fire an auth attempt on a bare Enter
}

# Blur the frozen desktop rather than depending on a wallpaper path (Noctalia
# owns the wallpaper; a screenshot keeps the locker self-contained).
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 320, 56
    position = 0, -120
    halign = center
    valign = center
    outline_thickness = 2
    dots_center = true
    rounding = 12
    placeholder_text = <i>Password…</i>
    fail_text = <i>Wrong — try again</i>
}

label {
    monitor =
    text = $TIME
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}
