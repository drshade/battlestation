# Keep Steam from crashing on malformed ALSA cards.
#
# Steam's bundled 32-bit libaudio.so segfaults at startup while enumerating
# PulseAudio cards if any card is exposed with ZERO profiles
# (ValveSoftware/steam-for-linux#13432). Two ways that has happened here:
#
#  1. Split mode. WirePlumber's stock ALSA monitor forces
#     api.alsa.split-enable=true, which leaves some non-UCM cards with ports
#     but no pulse profiles; pipewire-pulse logs "card N port M profiles
#     inconsistent". Split mode off restores normal profile-based
#     enumeration; UCM devices (USB DACs/interfaces) are unaffected.
#  2. Probe race at login. After a kernel + NVIDIA driver update (2026-08-28)
#     the NVIDIA HDMI card was probed with 0 profiles AND 0 routes on first
#     login even with split off; `systemctl --user restart wireplumber`
#     re-probed it correctly. Since the HDMI audio on the dGPU is never used,
#     the card is disabled outright below — Steam can't crash on a card that
#     doesn't exist.
#
# Maintenance note: these are per-device lists, so a NEW audio device can
# re-introduce the Steam crash until it is added here. Symptom: Steam
# segfaults in libaudio.so at startup and `pactl list cards` shows a card
# with no "Active Profile:" line. Fix: add its device.name to the no-split
# rule (or the disable rule, if the device is never used for audio); if it
# is already listed, restart wireplumber to re-probe.
monitor.alsa.rules = [
  {
    matches = [
      # NVIDIA dGPU (RTX 5080) HDMI/DP audio — never used; see (2) above
      { device.name = "alsa_card.pci-0000_01_00.1" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      # AMD iGPU HDMI/DP audio
      { device.name = "alsa_card.pci-0000_0d_00.1" }
      # Motherboard/monitor "Generic USB Audio" device (26ce:0a08) — same
      # zero-profile malformation as the GPU cards (added 2026-08-25)
      { device.name = "alsa_card.usb-Generic_USB_Audio-00" }
    ]
    actions = {
      update-props = {
        api.alsa.split-enable = false
      }
    }
  }
]
