# Let the graph clock follow the playing stream's sample rate instead of
# resampling everything to a fixed 48 kHz — bit-perfect playback when a single
# stream owns the device. Rates listed are the PCM rates the attached DAC
# (Topping DX5 II) supports; PipeWire picks the stream's rate when it is in
# this list and falls back to resampling otherwise.
context.properties = {
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 705600 768000 ]
}
