service_tier = "default"

# battlestation-ws status hooks (see ctl/src/lib.rs for the protocol and
# CODEX_HOOKS.md for the Codex hook surface). Non-managed command hooks must
# be reviewed and trusted once with /hooks before they run.
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "$HOME/.local/bin/bsctl agents set --kind codex waiting"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "$HOME/.local/bin/bsctl agents set --kind codex thinking"
# Turn-boundary asks delivery: `asks inbox` emits the Claude-compatible
# hookSpecificOutput/additionalContext envelope, which Codex's hook runtime
# models (UserPromptSubmitHookSpecificOutputWire, probed on 0.142.5). A new
# hook command needs the one-time /hooks re-trust. `|| true` is
# load-bearing: a failing prompt-time hook (stale binary without the verb,
# missing binary on a fresh machine) can block the human's prompt — an
# injection hook's only acceptable failure mode is empty output + exit 0.
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/bin/sh -c 'exec \"$HOME/.local/bin/bsctl\" asks inbox'"
# Turn-boundary delivery for messages from human-linked peer sessions.
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/bin/sh -c 'exec \"$HOME/.local/bin/bsctl\" comms inbox'"
# Per-turn Deck steering: `asks inject` states the Deck regime every turn —
# the presence nudge when the Deck switch is ON, the owner-disabled notice
# when OFF (same envelope as `asks inbox` above; Claude wires the same verb).
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/bin/sh -c 'exec \"$HOME/.local/bin/bsctl\" asks inject'"

[[hooks.PreToolUse]]
matcher = "*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "$HOME/.local/bin/bsctl agents set --kind codex tooling"

[[hooks.PostToolUse]]
matcher = "*"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "$HOME/.local/bin/bsctl agents set --kind codex thinking"

[[hooks.PermissionRequest]]
matcher = "*"
[[hooks.PermissionRequest.hooks]]
type = "command"
command = "$HOME/.local/bin/bsctl agents set --kind codex waiting"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "$HOME/.local/bin/bsctl agents set --kind codex waiting"

[[hooks.SubagentStart]]
matcher = "*"
[[hooks.SubagentStart.hooks]]
type = "command"
command = "$HOME/.local/bin/bsctl agents set --kind codex subagent-start"

[[hooks.SubagentStop]]
matcher = "*"
[[hooks.SubagentStop.hooks]]
type = "command"
command = "$HOME/.local/bin/bsctl agents set --kind codex subagent-stop"

# battlestation MCP server: the Deck, Switchboard and world queries
# (contract in ctl/src/lib.rs). Via sh -c because Codex execs MCP commands
# directly (no shell), so $HOME would not expand in `command`.
[mcp_servers.battlestation]
command = "/bin/sh"
args = ["-c", 'exec "$HOME/.local/bin/bsctl" mcp --kind codex']
# 2h (default 60s): the ask tool legitimately blocks for long waits —
# the agent picks wait_secs; this is the client-side ceiling.
tool_timeout_sec = 7200

[mcp_servers.battlestation.tools.whoami]
approval_mode = "approve"

[mcp_servers.battlestation.tools.list_asks]
approval_mode = "approve"

[mcp_servers.battlestation.tools.ask]
approval_mode = "approve"

[mcp_servers.battlestation.tools.get_ask]
approval_mode = "approve"

[mcp_servers.battlestation.tools.notify]
approval_mode = "approve"

[mcp_servers.battlestation.tools.set_name]
approval_mode = "approve"

[mcp_servers.battlestation.tools.list_peers]
approval_mode = "approve"

[mcp_servers.battlestation.tools.send_message]
approval_mode = "approve"

[mcp_servers.battlestation.tools.check_messages]
approval_mode = "approve"
