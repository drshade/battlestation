# Per-keyboard modifier remapping, applied by keyd at the evdev level (below the
# compositor), so it follows the physical keyboard across machines, TTYs, and
# games rather than living in any one Wayland config.
#
# Scoped by USB vendor:product id — only the listed device is remapped; every
# other keyboard (laptop built-in, etc.) passes through untouched.

# Ducky One2 SF RGB (keyd matches a bare vendor:product; no inline comments here)
[ids]
0416:0123

[main]
# Swap left Super(Win) and left Alt so the bottom-row modifier order reads
# Ctrl · Alt · Cmd, matching a Mac layout on a PC-layout board.
leftmeta = leftalt
leftalt  = leftmeta
